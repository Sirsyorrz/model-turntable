name: package

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: dev

env:
  CARGO_TERM_COLOR: always
  # Only CI builds update themselves; see src/update.rs.
  MT_UPDATER: "1"

jobs:
  linux:
    # Oldest supported runner, so the AppImage runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

      - name: AppImage
        run: |
          set -e
          app=AppDir
          install -Dm755 target/release/model-turntable $app/usr/bin/model-turntable
          install -Dm644 packaging/model-turntable.desktop $app/model-turntable.desktop
          install -Dm644 packaging/model-turntable.desktop $app/usr/share/applications/model-turntable.desktop
          install -Dm644 assets/icon.png $app/model-turntable.png
          install -Dm644 assets/icon.png $app/usr/share/icons/hicolor/256x256/apps/model-turntable.png
          ln -s usr/bin/model-turntable $app/AppRun
          curl -fsSLo appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool $app model-turntable-${{ inputs.version }}-x86_64.AppImage

      - name: Tarball
        run: |
          set -e
          d=model-turntable-${{ inputs.version }}-linux-x86_64
          mkdir $d
          cp target/release/model-turntable packaging/model-turntable.desktop LICENSE README.md $d/
          cp assets/icon.png $d/model-turntable.png
          tar czf $d.tar.gz $d

      # Same key format as the Tauri apps, so the signature drops straight
      # into latest.json.
      - name: Sign
        if: inputs.version != 'dev'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2 signer sign model-turntable-${{ inputs.version }}-x86_64.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            *.AppImage
            *.AppImage.sig
            *.tar.gz
          if-no-files-found: error

  # Repackages the Linux binary, on 24.04 for a newer flatpak-builder.
  flatpak:
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: linux
      - run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
      - run: |
          set -e
          id=io.github.Sirsyorrz.ModelTurntable
          tar xzf model-turntable-${{ inputs.version }}-linux-x86_64.tar.gz
          install -Dm755 model-turntable-${{ inputs.version }}-linux-x86_64/model-turntable target/release/model-turntable
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean --repo=flatpak-repo flatpak-build packaging/flatpak/$id.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo flatpak-repo model-turntable-${{ inputs.version }}-x86_64.flatpak $id
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: '*.flatpak'
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - shell: pwsh
        run: Copy-Item target/release/model-turntable.exe model-turntable-${{ inputs.version }}-windows-x86_64.exe

      - name: Sign
        if: inputs.version != 'dev'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2 signer sign model-turntable-${{ inputs.version }}-windows-x86_64.exe

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            *.exe
            *.exe.sig
          if-no-files-found: error
