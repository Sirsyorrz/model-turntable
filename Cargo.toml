[package]
name = "model-turntable"
version = "0.1.0"
edition = "2024"
description = "Render turntable GIFs and videos of STL, OBJ, FBX and glTF models"
license = "MIT"
repository = "https://github.com/Sirsyorrz/model-turntable"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
color_quant = "2.0.0"
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "wayland", "x11", "wgpu", "persistence"] }
egui = "0.37"
egui-wgpu = "0.37.0"
env_logger = "0.11.11"
ffmpeg-sidecar = "2.7.0"
gif = "0.14.2"
glam = { version = "0.34.1", features = ["bytemuck"] }
gltf = { version = "1.4.1", default-features = false, features = ["import", "names", "utils", "KHR_materials_emissive_strength", "KHR_materials_unlit"] }
half = { version = "2.7.1", features = ["bytemuck"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "hdr", "tga", "bmp", "webp"] }
log = "0.4.35"
pollster = "1.0.1"
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ufbx = "0.11.5"
wgpu = "30.0.1"

[target."cfg(target_os = \"linux\")".dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true

[build-dependencies]
winresource = "0.1.34"
